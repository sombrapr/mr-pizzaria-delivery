services:
  - type: web
    name: mr-pizzaria-delivery
    runtime: node
    plan: free
    buildCommand: node --check server.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: ./data/mr-delivery.json
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PRINT_API_KEY
        generateValue: true
      - key: WHATSAPP_INTERNAL_KEY
        generateValue: true
